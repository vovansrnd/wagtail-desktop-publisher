[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wagtail-desktop-publisher"
version = "0.3.0"
description = "Desktop Markdown publisher and image synchronizer for Wagtail CMS."
readme = "README.md"
authors = [{ name = "Vladimir Tarasov" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "python-frontmatter>=1.0",
    "markdown>=3.5",
    "customtkinter>=5.2",
]

[project.scripts]
wagtail-publisher = "wagtail_desktop_publisher.cli:main"
wagtail-publisher-gui = "wagtail_desktop_publisher.gui.app:main"
